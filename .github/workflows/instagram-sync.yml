name: Sync Instagram posts

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

concurrency:
  group: instagram-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Start or check Bright Data snapshot
        env:
          INSTAGRAM_SYNC_URL: ${{ secrets.INSTAGRAM_SYNC_URL }}
          INSTAGRAM_SYNC_TOKEN: ${{ secrets.INSTAGRAM_SYNC_TOKEN }}
        run: |
          test -n "$INSTAGRAM_SYNC_URL"
          test -n "$INSTAGRAM_SYNC_TOKEN"
          curl --fail --silent --show-error --max-time 90 \
            --header "Authorization: Bearer $INSTAGRAM_SYNC_TOKEN" \
            "$INSTAGRAM_SYNC_URL"
